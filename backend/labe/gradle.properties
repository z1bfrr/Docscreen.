# Gradle JVM Arguments
# Enable native access for JDK 25 compatibility
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# CRITICAL: Disable native-platform — it fails to parse JDK 25 version string
org.gradle.native=false

# Use Gradle daemon for faster builds
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android specific
android.useAndroidX=true
android.enableJetifier=false

# Kotlin options
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
