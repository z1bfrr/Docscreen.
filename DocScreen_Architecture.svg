<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Card Shadow -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#0f172a" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; letter-spacing: -0.4px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #64748b; font-weight: 400; }
    .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    .card-tech { font-family: "JetBrains Mono", Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #2563eb; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.45; }
    .card-tag { font-family: "JetBrains Mono", Consolas, monospace; font-size: 9px; fill: #64748b; }
    .flow-line { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .solid-line { fill: none; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <!-- Clean White Canvas Background -->
  <rect width="1200" height="680" fill="#ffffff" />

  <!-- Subtle Minimal Grid -->
  <g opacity="0.4" stroke="#f1f5f9" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="720" y1="0" x2="720" y2="680" />
    <line x1="960" y1="0" x2="960" y2="680" />
  </g>

  <!-- HEADER BAR -->
  <g transform="translate(40, 26)">
    <!-- Minimalist Icon -->
    <rect x="0" y="2" width="30" height="30" rx="6" fill="#0f172a" />
    <path d="M 15 8 L 22 11 L 22 18 C 22 22.5 15 25 15 25 C 15 25 8 22.5 8 18 L 8 11 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />

    <text x="40" y="22" class="title">DocScreen Architecture</text>
    <text x="40" y="38" class="subtitle">System Architecture &amp; Analysis Data Flow</text>

    <!-- Top Right Meta -->
    <g transform="translate(930, 8)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5px" font-weight="500" fill="#475569">
        SIH 2026 · Multi-Layer Engine
      </text>
    </g>
  </g>

  <!-- FLOW CONNECTORS -->
  <!-- Col 1 (Frontend) -> Col 2 (FastAPI) -->
  <path d="M 195 240 L 245 240" class="flow-line" marker-end="url(#arrow)" />

  <!-- Col 2 (FastAPI) -> Distribution Bus -->
  <path d="M 395 240 L 440 240" class="flow-line" />
  <!-- Spine to 5 pipeline modules -->
  <path d="M 440 145 L 440 505" class="flow-line" />
  <path d="M 440 145 L 475 145" class="flow-line" marker-end="url(#arrow)" />
  <path d="M 440 235 L 475 235" class="flow-line" marker-end="url(#arrow)" />
  <path d="M 440 325 L 475 325" class="flow-line" marker-end="url(#arrow)" />
  <path d="M 440 415 L 475 415" class="flow-line" marker-end="url(#arrow)" />
  <path d="M 440 505 L 475 505" class="flow-line" marker-end="url(#arrow)" />

  <!-- Col 3 (Pipeline) -> Convergence Bus -->
  <path d="M 725 145 L 755 145" class="flow-line" />
  <path d="M 725 235 L 755 235" class="flow-line" />
  <path d="M 725 325 L 755 325" class="flow-line" />
  <path d="M 725 415 L 755 415" class="flow-line" />
  <path d="M 725 505 L 755 505" class="flow-line" />
  <path d="M 755 145 L 755 505" class="flow-line" />
  <path d="M 755 325 L 785 325" class="flow-line" marker-end="url(#arrow)" />

  <!-- Col 4 (Risk Engine) -> Col 5 (Storage & Human Review) -->
  <path d="M 975 325 L 1020 325" class="flow-line" marker-end="url(#arrow)" />


  <!-- COLUMN 1: CLIENT LAYER -->
  <g transform="translate(40, 95)">
    <rect width="155" height="530" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="14" y="26" class="col-title">1. Client Layer</text>

    <!-- Document Ingestion -->
    <g transform="translate(10, 40)">
      <rect width="135" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="24" class="card-title">Document Input</text>
      <text x="12" y="42" class="card-tech">PNG · JPG · PDF</text>
      <text x="12" y="60" class="card-desc">• ID Cards &amp; Passports</text>
      <text x="12" y="74" class="card-desc">• Certificates &amp; Forms</text>
    </g>

    <!-- Next.js App -->
    <g transform="translate(10, 145)">
      <rect width="135" height="155" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" filter="url(#softShadow)" />
      <text x="12" y="24" class="card-title">Next.js 14 App</text>
      <text x="12" y="42" class="card-tech">React 19 · App Router</text>
      <line x1="12" y1="52" x2="123" y2="52" class="solid-line" />
      <text x="12" y="70" class="card-desc">• Web Dashboard</text>
      <text x="12" y="86" class="card-desc">• Bounding Box Viewer</text>
      <text x="12" y="102" class="card-desc">• Recharts Analytics</text>
      <text x="12" y="118" class="card-desc">• Reviewer Triage UI</text>
      <text x="12" y="140" class="card-tag">PORT 3000</text>
    </g>

    <!-- Deduplication -->
    <g transform="translate(10, 445)">
      <rect width="135" height="65" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="card-desc" font-weight="600" fill="#0f172a">SHA-256 Ledger</text>
      <text x="10" y="38" class="card-desc">Every document is</text>
      <text x="10" y="52" class="card-desc">hashed &amp; verified.</text>
    </g>
  </g>


  <!-- COLUMN 2: API GATEWAY -->
  <g transform="translate(245, 95)">
    <rect width="150" height="530" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="14" y="26" class="col-title">2. API Gateway</text>

    <!-- FastAPI Node -->
    <g transform="translate(10, 40)">
      <rect width="130" height="470" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="24" class="card-title">FastAPI Backend</text>
      <text x="12" y="42" class="card-tech">Python 3.11 · Uvicorn</text>
      <line x1="12" y1="54" x2="118" y2="54" class="solid-line" />

      <text x="12" y="74" class="card-desc" font-weight="600" fill="#0f172a">Endpoints:</text>
      <text x="12" y="94" class="card-tech">POST /api/analyze</text>
      <text x="12" y="110" class="card-desc">Async screening</text>

      <text x="12" y="132" class="card-tech">GET /api/documents</text>
      <text x="12" y="148" class="card-desc">Document registry</text>

      <text x="12" y="170" class="card-tech">GET /api/risk-queue</text>
      <text x="12" y="186" class="card-desc">Triage queue</text>

      <text x="12" y="208" class="card-tech">POST /api/review</text>
      <text x="12" y="224" class="card-desc">Human verdict</text>

      <text x="12" y="246" class="card-tech">GET /api/analytics</text>
      <text x="12" y="262" class="card-desc">System statistics</text>

      <line x1="12" y1="280" x2="118" y2="280" class="solid-line" />

      <text x="12" y="304" class="card-desc" font-weight="600" fill="#0f172a">Capabilities:</text>
      <text x="12" y="322" class="card-desc">• Pydantic Schemas</text>
      <text x="12" y="338" class="card-desc">• OpenAPI / Swagger</text>
      <text x="12" y="354" class="card-desc">• Async Worker Flow</text>

      <text x="12" y="445" class="card-tag">PORT 8000</text>
    </g>
  </g>


  <!-- COLUMN 3: MULTI-LAYER FORENSIC ENGINES -->
  <g transform="translate(475, 95)">
    <rect width="250" height="530" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="14" y="26" class="col-title">3. Analysis Pipeline (Parallel)</text>

    <!-- Engine 1: Vision Forensics -->
    <g transform="translate(10, 40)">
      <rect width="230" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="20" class="card-title">Vision Forensics &amp; ELA</text>
      <text x="12" y="36" class="card-tech">OpenCV · Error Level Analysis · PIL</text>
      <text x="12" y="52" class="card-desc">Resaves at Q=90 to spot compression delta.</text>
      <text x="12" y="66" class="card-desc">12x12 noise grid variance &amp; edge cut analysis.</text>
    </g>

    <!-- Engine 2: Dual OCR -->
    <g transform="translate(10, 126)">
      <rect width="230" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="20" class="card-title">Dual OCR Engine</text>
      <text x="12" y="36" class="card-tech">Tesseract (Primary) → EasyOCR (Fallback)</text>
      <text x="12" y="52" class="card-desc">Character extraction with coordinates [x,y,w,h].</text>
      <text x="12" y="66" class="card-desc">Structured anchor regex for Name, DOB, and ID.</text>
    </g>

    <!-- Engine 3: Template Matching -->
    <g transform="translate(10, 212)">
      <rect width="230" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="20" class="card-title">Template &amp; Layout Matching</text>
      <text x="12" y="36" class="card-tech">Computer Vision Classifier</text>
      <text x="12" y="52" class="card-desc">Matches Aadhaar, PAN, and Passport geometry.</text>
      <text x="12" y="66" class="card-desc">Detects shifted photo boxes &amp; missing emblems.</text>
    </g>

    <!-- Engine 4: QR & Consistency -->
    <g transform="translate(10, 298)">
      <rect width="230" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="20" class="card-title">QR &amp; Cross-Field Consistency</text>
      <text x="12" y="36" class="card-tech">pyzbar · Temporal Logic Engine</text>
      <text x="12" y="52" class="card-desc">Cross-validates decoded QR against OCR text.</text>
      <text x="12" y="66" class="card-desc">Enforces Issue &lt; Expiry &amp; Age-DOB sanity.</text>
    </g>

    <!-- Engine 5: ML Anomaly -->
    <g transform="translate(10, 384)">
      <rect width="230" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="20" class="card-title">ML Anomaly Detector</text>
      <text x="12" y="36" class="card-tech">Scikit-Learn Isolation Forest</text>
      <text x="12" y="52" class="card-desc">Outlier isolation on multidimensional vectors.</text>
      <text x="12" y="66" class="card-desc">Generates continuous anomaly score (0.0 – 1.0).</text>
    </g>

    <!-- Degradation note -->
    <g transform="translate(10, 470)">
      <rect width="230" height="46" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="19" class="card-desc" font-weight="600" fill="#0f172a">Fault Tolerant Execution</text>
      <text x="10" y="34" class="card-desc">Each engine operates with isolated exception handlers.</text>
    </g>
  </g>


  <!-- COLUMN 4: DECISION & RISK ENGINE -->
  <g transform="translate(785, 95)">
    <rect width="190" height="530" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="14" y="26" class="col-title">4. Risk Fusion Engine</text>

    <!-- Weighted Formula -->
    <g transform="translate(10, 40)">
      <rect width="170" height="230" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="12" y="22" class="card-title">Signal Fusion Logic</text>
      <text x="12" y="38" class="card-tech">Score = Σ (Weight_i × Signal_i)</text>
      <line x1="12" y1="48" x2="158" y2="48" class="solid-line" />

      <text x="12" y="68" class="card-desc">• Visual Tamper: <tspan font-weight="600" fill="#0f172a">25%</tspan></text>
      <text x="12" y="86" class="card-desc">• Layout Shift: <tspan font-weight="600" fill="#0f172a">15%</tspan></text>
      <text x="12" y="104" class="card-desc">• Cross-Field: <tspan font-weight="600" fill="#0f172a">15%</tspan></text>
      <text x="12" y="122" class="card-desc">• ML Anomaly: <tspan font-weight="600" fill="#0f172a">15%</tspan></text>
      <text x="12" y="140" class="card-desc">• OCR Confidence: <tspan font-weight="600" fill="#0f172a">10%</tspan></text>
      <text x="12" y="158" class="card-desc">• Pattern Rules: <tspan font-weight="600" fill="#0f172a">10%</tspan></text>
      <text x="12" y="176" class="card-desc">• Metadata / Quality: <tspan font-weight="600" fill="#0f172a">10%</tspan></text>

      <line x1="12" y1="190" x2="158" y2="190" class="solid-line" />
      <text x="12" y="212" class="card-tag">Output: 0 – 100 Risk Score</text>
    </g>

    <!-- Critical Override -->
    <g transform="translate(10, 282)">
      <rect width="170" height="106" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="10" y="20" class="card-title">Critical Override</text>
      <text x="10" y="38" class="card-desc">If any test produces a</text>
      <text x="10" y="52" class="card-desc" font-weight="600" fill="#0f172a">CRITICAL severity finding</text>
      <text x="10" y="68" class="card-desc">(e.g. QR text mismatch),</text>
      <text x="10" y="86" class="card-desc">Score immediately elevates</text>
      <text x="10" y="100" class="card-desc" font-weight="700" fill="#0f172a">to ≥ 70 (HIGH RISK)</text>
    </g>

    <!-- Risk Thresholds -->
    <g transform="translate(10, 400)">
      <rect width="170" height="116" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="18" class="col-title">Decision Thresholds</text>

      <rect x="10" y="26" width="150" height="24" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="42" class="card-desc" font-weight="600" fill="#0f172a">0 – 30 : LOW RISK</text>

      <rect x="10" y="56" width="150" height="24" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="72" class="card-desc" font-weight="600" fill="#0f172a">31 – 65 : MEDIUM RISK</text>

      <rect x="10" y="86" width="150" height="24" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="102" class="card-desc" font-weight="600" fill="#0f172a">66 – 100 : HIGH RISK</text>
    </g>
  </g>


  <!-- COLUMN 5: STORAGE & REVIEW -->
  <g transform="translate(1020, 95)">
    <rect width="140" height="530" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="14" y="26" class="col-title">5. Persistence</text>

    <!-- Database -->
    <g transform="translate(10, 40)">
      <rect width="120" height="175" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)" />
      <text x="10" y="22" class="card-title">SQLite Ledger</text>
      <text x="10" y="38" class="card-tech">SQLAlchemy ORM</text>
      <line x1="10" y1="48" x2="110" y2="48" class="solid-line" />

      <text x="10" y="68" class="card-desc">• documents</text>
      <text x="10" y="84" class="card-desc">• analyses</text>
      <text x="10" y="100" class="card-desc">• findings</text>
      <text x="10" y="116" class="card-desc">• extracted_fields</text>
      <text x="10" y="132" class="card-desc">• audit_logs</text>
      <text x="10" y="156" class="card-tag">Immutable Audit</text>
    </g>

    <!-- Reviewer Queue -->
    <g transform="translate(10, 228)">
      <rect width="120" height="190" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" filter="url(#softShadow)" />
      <text x="10" y="22" class="card-title">Review Queue</text>
      <text x="10" y="38" class="card-tech">Human-in-the-Loop</text>
      <line x1="10" y1="48" x2="110" y2="48" class="solid-line" />

      <text x="10" y="68" class="card-desc">• Officer Dashboard</text>
      <text x="10" y="86" class="card-desc">• Visual Heatmaps</text>
      <text x="10" y="104" class="card-desc">• Field Bounding Boxes</text>
      <text x="10" y="122" class="card-desc">• Accept / Reject</text>
      <text x="10" y="140" class="card-desc">• Reason Logging</text>
      <text x="10" y="172" class="card-tag">Manual Triage</text>
    </g>

    <!-- Explainable -->
    <g transform="translate(10, 440)">
      <rect width="120" height="70" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="card-desc" font-weight="600" fill="#0f172a">Explainable AI</text>
      <text x="10" y="38" class="card-desc">Every score has</text>
      <text x="10" y="52" class="card-desc">detailed findings.</text>
    </g>
  </g>

</svg>
